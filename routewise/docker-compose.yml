services:
  postgres:
    image: postgres:16-alpine
    container_name: routewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routewise
      POSTGRES_USER: routewise
      POSTGRES_PASSWORD: routewise
    ports:
      - '5432:5432'
    volumes:
      - routewise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U routewise']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routewise_pgdata:
